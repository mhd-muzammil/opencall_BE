name: opencall-backend

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-runtime-hardening: &runtime-hardening
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *default-logging

services:
  postgres:
    image: postgres:16-alpine
    container_name: opencall-postgres
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opencall}
      POSTGRES_USER: ${POSTGRES_USER:-opencall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/migrations:/opencall-migrations:ro
      - ./infra/postgres/seeds:/opencall-seeds:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 12
    logging: *default-logging
    pids_limit: 256
    mem_reservation: 256m
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    cpus: ${POSTGRES_CPUS:-1.0}

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: opencall-api
    restart: on-failure:5
    stop_grace_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-opencall}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-opencall}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      UPLOAD_DIR: /app/storage/uploads
      ADMIN_COOKIE_SECRET: ${ADMIN_COOKIE_SECRET:?set ADMIN_COOKIE_SECRET}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?set ADMIN_SESSION_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN}
      # Payroll integration (engineer case dispatch + live tracking). Optional —
      # leave unset to disable it gracefully. Point PAYROLL_API_URL at the
      # Payroll backend and use a Payroll admin service account (e.g. opencall-bot).
      PAYROLL_API_URL: ${PAYROLL_API_URL:-}
      PAYROLL_API_USER: ${PAYROLL_API_USER:-}
      PAYROLL_API_PASSWORD: ${PAYROLL_API_PASSWORD:-}
      # Every date the app derives from "now" is a business day in IST. Leaving the
      # container on UTC put anything before 05:30 IST on the previous day.
      TZ: ${TZ:-Asia/Kolkata}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /app/.adminjs:rw,nosuid,nodev,size=32m
    volumes:
      - api-uploads:/app/storage/uploads:rw
    networks:
      - app
      - data
    ports:
      - "${API_PORT:-4000}:4000"
    <<: *runtime-hardening
    healthcheck:
      # Liveness, not readiness — see the long note beside HEALTHCHECK in Dockerfile.
      # /health/runtime queries the database through the shared pool, so a starved
      # pool made this probe time out and Swarm killed a working API.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    pids_limit: 256
    mem_reservation: 512m
    mem_limit: ${API_MEM_LIMIT:-1536m}
    cpus: ${API_CPUS:-1.5}

  # FieldEZ auto-sync worker — OFF by default (profile-gated), because Dokploy
  # deploys a single compose file and cannot chain the docker-compose.fieldez.yml
  # overlay. Enable by setting COMPOSE_PROFILES=fieldez (plus the FIELDEZ_* and
  # OPENCALL_* vars below) in the deploy environment. `docker compose up
  # fieldez-worker` also activates it explicitly. Same service as the overlay;
  # env guards are soft here so the base stack still parses with the profile off.
  fieldez-worker:
    build:
      context: .
      dockerfile: Dockerfile.fieldez-worker
    container_name: opencall-fieldez-worker
    profiles: ["fieldez"]
    restart: unless-stopped
    init: true
    # Let a download/upload in flight finish before the process is killed.
    stop_grace_period: 60s
    depends_on:
      api:
        condition: service_healthy
    environment:
      # --- FieldEZ (source) — required for the worker to start ---
      FIELDEZ_USERNAME: ${FIELDEZ_USERNAME:-}
      FIELDEZ_PASSWORD: ${FIELDEZ_PASSWORD:-}
      FIELDEZ_URL: ${FIELDEZ_URL:-https://prod.fsmsupport.com/frontend/auth/login}
      FIELDEZ_REPORTS_URL: ${FIELDEZ_REPORTS_URL:-https://prod.fsmsupport.com/frontend/birt/viewlist}
      FIELDEZ_REPORT_NAME: ${FIELDEZ_REPORT_NAME:-Flex WIP Report ASP}
      # Folder path walked before looking for a report row ("A>B" = A then B). FieldEZ
      # moved the reports into REPORTS > OTB REPORT on 2026-08-21 and the list now lands
      # empty; an env var means the next move costs a restart, not a deploy.
      FIELDEZ_REPORT_FOLDER_PATH: ${FIELDEZ_REPORT_FOLDER_PATH:-REPORTS>OTB REPORT}
      FIELDEZ_FORMAT: ${FIELDEZ_FORMAT:-XLSX}
      FIELDEZ_SYNC_INTERVAL_MS: ${FIELDEZ_SYNC_INTERVAL_MS:-900000}
      # Consecutive failed cycles the worker tolerates before it exits on purpose and
      # lets the restart policy give it a clean process. Guards the case where the
      # browser or the FieldEZ session is wedged in a way no single cycle can undo.
      FIELDEZ_MAX_CONSECUTIVE_FAILURES: ${FIELDEZ_MAX_CONSECUTIVE_FAILURES:-3}
      # --- Closure report job (second job in the SAME worker process) ---
      # Blank report name ⇒ the job is never scheduled, so leaving these unset keeps
      # the worker behaving exactly as it did before.
      FIELDEZ_CLOSURE_REPORT_NAME: ${FIELDEZ_CLOSURE_REPORT_NAME:-}
      FIELDEZ_CLOSURE_INTERVAL_MS: ${FIELDEZ_CLOSURE_INTERVAL_MS:-900000}
      FIELDEZ_CLOSURE_DATE_MODE: ${FIELDEZ_CLOSURE_DATE_MODE:-today}
      # Pause between two jobs due in the same cycle (only ever on the first cycle
      # after a restart), so the closure import does not hit the API while the WIP
      # job's report generation is still finishing.
      FIELDEZ_JOB_STAGGER_MS: ${FIELDEZ_JOB_STAGGER_MS:-60000}
      FIELDEZ_PROFILE_DIR: /data/fieldez-profile
      # The closure workbook's timestamps are IST wall-clock. The parser decodes Excel
      # serials timezone-free, but this keeps every other date path (and the logs) on
      # the same clock as the business day.
      TZ: ${TZ:-Asia/Kolkata}
      # --- OpenCall (target) ---
      # Internal service URL on the `app` network — no public round-trip.
      OPENCALL_API_URL: ${OPENCALL_API_URL:-http://api:4000}
      # Admin login used to obtain + auto-refresh an upload token (SUPER_ADMIN).
      OPENCALL_USERNAME: ${OPENCALL_USERNAME:-}
      OPENCALL_PASSWORD: ${OPENCALL_PASSWORD:-}
      # Optional: pin uploads to a region (blank = all regions, as a SUPER_ADMIN).
      OPENCALL_REGION_ID: ${OPENCALL_REGION_ID:-}
    volumes:
      # Warm browser profile: the FieldEZ session persists across restarts.
      - fieldez-profile:/data/fieldez-profile:rw
    networks:
      # `app` gives egress to FieldEZ AND reaches the `api` service.
      - app
    # Chromium needs a large /dev/shm or it crashes on content-heavy pages.
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    pids_limit: 512
    mem_reservation: 512m
    mem_limit: ${FIELDEZ_WORKER_MEM_LIMIT:-2g}
    cpus: ${FIELDEZ_WORKER_CPUS:-1.0}

networks:
  app:
    name: opencall-backend-app
  data:
    name: opencall-backend-data
    internal: true

volumes:
  postgres-data:
    name: opencall-postgres-data
  api-uploads:
    name: opencall-api-uploads
  fieldez-profile:
    name: opencall-fieldez-profile
