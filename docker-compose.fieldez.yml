# FieldEZ auto-sync worker — the full service definition lives in
# docker-compose.yml behind the `fieldez` profile (Dokploy deploys a single
# compose file, so the base file must carry the service; enable it there with
# COMPOSE_PROFILES=fieldez).
#
# This overlay remains the manual/CLI entry point:
#
#   docker compose -f docker-compose.yml -f docker-compose.fieldez.yml up -d --build fieldez-worker
#
# Naming the service explicitly auto-activates its profile; the :? guards below
# make the CLI route fail fast when the required secrets are missing from the
# deploy environment (.env) — NEVER commit them.

name: opencall-backend

services:
  fieldez-worker:
    environment:
      # --- FieldEZ (source) — REQUIRED ---
      FIELDEZ_USERNAME: ${FIELDEZ_USERNAME:?set FIELDEZ_USERNAME}
      FIELDEZ_PASSWORD: ${FIELDEZ_PASSWORD:?set FIELDEZ_PASSWORD}
      # --- OpenCall (target) — admin login for upload token — REQUIRED ---
      OPENCALL_USERNAME: ${OPENCALL_USERNAME:?set OPENCALL_USERNAME}
      OPENCALL_PASSWORD: ${OPENCALL_PASSWORD:?set OPENCALL_PASSWORD}
      # --- Closure report job — OPTIONAL ---
      # Second job in the same worker process (same browser, same profile). Blank
      # report name ⇒ never scheduled, so this overlay stays backwards-compatible.
      FIELDEZ_CLOSURE_REPORT_NAME: ${FIELDEZ_CLOSURE_REPORT_NAME:-}
      FIELDEZ_CLOSURE_INTERVAL_MS: ${FIELDEZ_CLOSURE_INTERVAL_MS:-900000}
      FIELDEZ_CLOSURE_DATE_MODE: ${FIELDEZ_CLOSURE_DATE_MODE:-today}
      FIELDEZ_JOB_STAGGER_MS: ${FIELDEZ_JOB_STAGGER_MS:-60000}
      TZ: ${TZ:-Asia/Kolkata}
